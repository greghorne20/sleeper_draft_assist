<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* ---------------------------------------------------------------- tokens
   Light is the base set; the two blocks after it only redefine tokens, so
   nothing is ever defined solely inside a media query. */
:root {
  --bg:        #eef0f4;
  --panel:     #ffffff;
  --panel-2:   #f6f7f9;
  --ink:       #14161a;
  --ink-2:     #4a515e;
  --muted:     #79818f;
  --line:      #dfe3e9;
  --line-firm: #c6ccd6;
  --inverse-bg:#14161a;
  --inverse-ink:#f6f7f9;

  --qb: #c2417f;  --rb: #2f8f4e;  --wr: #3d7fd9;  --te: #c77d16;
  --qb-bg: #fbeaf2; --rb-bg: #e6f5ec; --wr-bg: #e8f0fc; --te-bg: #fbf0df;

  --danger:    #c8323a;
  --danger-bg: #fdecec;
  --live:      #2f8f4e;

  --radius: 7px;
  --shadow: 0 1px 2px rgba(20,22,26,.06), 0 4px 14px rgba(20,22,26,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0e1014;
    --panel:     #171a20;
    --panel-2:   #1e222a;
    --ink:       #e9ecf1;
    --ink-2:     #b3bac6;
    --muted:     #838c9b;
    --line:      #262b34;
    --line-firm: #3a414d;
    --inverse-bg:#e9ecf1;
    --inverse-ink:#14161a;

    --qb: #ef7bab;  --rb: #52c584;  --wr: #78aaf5;  --te: #e4a856;
    --qb-bg: #2e1622; --rb-bg: #12291d; --wr-bg: #16233a; --te-bg: #2f2312;

    --danger:    #ff6b6b;
    --danger-bg: #2c1618;
    --live:      #52c584;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg:#0e1014; --panel:#171a20; --panel-2:#1e222a;
  --ink:#e9ecf1; --ink-2:#b3bac6; --muted:#838c9b;
  --line:#262b34; --line-firm:#3a414d;
  --inverse-bg:#e9ecf1; --inverse-ink:#14161a;
  --qb:#ef7bab; --rb:#52c584; --wr:#78aaf5; --te:#e4a856;
  --qb-bg:#2e1622; --rb-bg:#12291d; --wr-bg:#16233a; --te-bg:#2f2312;
  --danger:#ff6b6b; --danger-bg:#2c1618; --live:#52c584;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
}

/* ---------------------------------------------------------------- base */
* { box-sizing: border-box; }
html { color-scheme: light dark; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 14px/1.45 "Barlow", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
.cond { font-family: "Barlow Condensed", "Barlow Semi Condensed", ui-sans-serif, system-ui, sans-serif; }
:focus-visible { outline: 2px solid var(--wr); outline-offset: 2px; border-radius: 3px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------------------------------------------------------- scoreboard */
#stale {
  display: none; background: var(--danger); color: #fff;
  padding: 7px 20px; font-weight: 600; letter-spacing: .01em;
}
#stale.on { display: block; }

.board {
  position: sticky; top: 0; z-index: 20;
  background: var(--panel); border-bottom: 1px solid var(--line-firm);
  display: flex; align-items: center; gap: 26px;
  padding: 12px 20px 10px; flex-wrap: wrap;
}
.board.mine { background: var(--inverse-bg); color: var(--inverse-ink); border-bottom-color: var(--inverse-bg); }
.board.mine .kicker, .board.mine .until { color: color-mix(in srgb, var(--inverse-ink) 65%, transparent); }
.board.mine .until b { color: var(--inverse-ink); }
.board.mine .tog { color: var(--inverse-ink); border-color: color-mix(in srgb, var(--inverse-ink) 30%, transparent); }

.kicker {
  font-family: "Barlow Condensed", ui-sans-serif, sans-serif;
  font-size: 12px; font-weight: 600; letter-spacing: .13em;
  text-transform: uppercase; color: var(--muted); display: block; line-height: 1;
  margin-bottom: 3px;
}
.count { display: flex; align-items: baseline; gap: 7px; }
.count .big {
  font-family: "Barlow Condensed", ui-sans-serif, sans-serif;
  font-size: 42px; font-weight: 700; line-height: .88; letter-spacing: -.01em;
}
.count .of { font-size: 15px; font-weight: 500; color: var(--muted); }
.board.mine .count .of { color: color-mix(in srgb, var(--inverse-ink) 60%, transparent); }

.state {
  font-family: "Barlow Condensed", ui-sans-serif, sans-serif;
  font-size: 21px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 5px 13px; border-radius: var(--radius); line-height: 1.1;
  border: 1px solid var(--line-firm); color: var(--ink-2); white-space: nowrap;
}
.state.mine { background: var(--live); border-color: var(--live); color: #fff; }
.state.done { background: var(--panel-2); }
.until { color: var(--muted); font-size: 14px; }
.until b { color: var(--ink); font-weight: 600; font-size: 17px; }
.spacer { margin-left: auto; }
.tog {
  font: inherit; font-size: 12px; cursor: pointer; color: var(--ink-2);
  background: transparent; border: 1px solid var(--line-firm);
  border-radius: var(--radius); padding: 4px 10px;
}

/* --------------------------------------------------- my pick-number rail */
.rail {
  display: flex; gap: 4px; overflow-x: auto; padding: 9px 20px;
  background: var(--panel-2); border-bottom: 1px solid var(--line);
  align-items: center;
}
.rail .lab {
  font-family: "Barlow Condensed", ui-sans-serif, sans-serif;
  font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); margin-right: 6px; white-space: nowrap;
}
.cell {
  font-family: "Barlow Condensed", ui-sans-serif, sans-serif;
  min-width: 34px; text-align: center; padding: 3px 6px; border-radius: 5px;
  font-size: 15px; font-weight: 600; color: var(--ink-2);
  background: var(--panel); border: 1px solid var(--line);
}
.cell.spent { color: var(--muted); background: transparent; border-color: transparent; text-decoration: line-through; }
.cell.next { border-color: var(--live); color: var(--live); box-shadow: 0 0 0 2px color-mix(in srgb, var(--live) 22%, transparent); }

/* -------------------------------------------------------------- layout */
main {
  display: grid; grid-template-columns: minmax(0,1fr) 340px;
  gap: 18px; padding: 18px 20px 40px; align-items: start;
}
@media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.panel.urgent { border-color: var(--danger); box-shadow: var(--shadow); }
.phead {
  display: flex; align-items: baseline; gap: 10px;
  padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2);
}
.panel.urgent .phead { background: var(--danger-bg); border-bottom-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.ptitle {
  font-family: "Barlow Condensed", ui-sans-serif, sans-serif;
  font-size: 14px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink);
}
.panel.urgent .ptitle { color: var(--danger); }
.pnote { font-size: 12.5px; color: var(--muted); }
.pbody { padding: 12px 14px; }

/* --------------------------------------------------------------- table */
table { width: 100%; border-collapse: collapse; }
thead th {
  font-family: "Barlow Condensed", ui-sans-serif, sans-serif;
  font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); text-align: left; padding: 7px 14px 6px; border-bottom: 1px solid var(--line);
}
tbody td { padding: 7px 14px; border-bottom: 1px solid var(--line); vertical-align: baseline; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: var(--panel-2); }
td.n, th.n { text-align: right; }
.rk { font-family: "Barlow Condensed", ui-sans-serif, sans-serif; font-size: 16px; font-weight: 600; color: var(--ink-2); }
.nm { font-weight: 600; }
.meta { color: var(--muted); font-size: 12.5px; }
.adp { font-family: "Barlow Condensed", ui-sans-serif, sans-serif; font-size: 16px; font-weight: 600; }

/* position chips: the board's own colour language */
.pos {
  display: inline-block; min-width: 42px; text-align: center;
  font-family: "Barlow Condensed", ui-sans-serif, sans-serif;
  font-size: 13px; font-weight: 700; letter-spacing: .04em;
  padding: 2px 6px; border-radius: 4px;
}
.pos-QB { color: var(--qb); background: var(--qb-bg); }
.pos-RB { color: var(--rb); background: var(--rb-bg); }
.pos-WR { color: var(--wr); background: var(--wr-bg); }
.pos-TE { color: var(--te); background: var(--te-bg); }

.tag {
  display: inline-block; font-size: 11.5px; font-weight: 500; line-height: 1.5;
  padding: 0 6px; margin: 1px 3px 1px 0; border-radius: 4px;
  background: var(--panel-2); color: var(--ink-2); border: 1px solid var(--line);
}
.tag.bad { background: var(--danger-bg); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 30%, transparent); }
.tag.good { background: var(--rb-bg); color: var(--rb); border-color: color-mix(in srgb, var(--rb) 30%, transparent); }
.scout { color: var(--muted); font-size: 12.5px; margin-top: 2px; max-width: 62ch; }

/* ------------------------------------------------------------ side bits */
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; }
dl { margin: 0; }
.slots { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.slot {
  font-family: "Barlow Condensed", ui-sans-serif, sans-serif;
  font-size: 13px; font-weight: 600; letter-spacing: .05em;
  padding: 2px 8px; border-radius: 4px;
  border: 1px dashed var(--line-firm); color: var(--muted);
}
.slot.filled { border-style: solid; border-color: transparent; background: var(--panel-2); color: var(--ink-2); }

/* tier depth: the cliff, made visible */
.tier-pos { margin-bottom: 11px; }
.tier-pos:last-child { margin-bottom: 0; }
.tier-name {
  font-family: "Barlow Condensed", ui-sans-serif, sans-serif;
  font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px;
}
.tier-row { display: grid; grid-template-columns: 26px 1fr 22px; gap: 8px; align-items: center; padding: 1.5px 0; }
.tier-lab { font-size: 11.5px; color: var(--muted); }
.tier-bar { height: 7px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.tier-fill { height: 100%; border-radius: 3px; }
.tier-num { font-size: 12px; color: var(--ink-2); text-align: right; font-weight: 600; }
.tier-row.thin .tier-num { color: var(--danger); }

/* Urgency lives on the row, not in a second table: a severity stripe plus a
   chip, so a leaving player reads at a glance without splitting the board. */
tbody tr.leaving td:first-child { box-shadow: inset 3px 0 0 var(--danger); }
tbody tr.leaving .rk { color: var(--danger); }
.gone {
  display: inline-block; font-family: "Barlow Condensed", ui-sans-serif, sans-serif;
  font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--danger); background: var(--danger-bg); border-radius: 4px; padding: 1px 6px;
  border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
}
.stays { font-size: 12px; color: var(--muted); }

.seg { display: inline-flex; border: 1px solid var(--line-firm); border-radius: var(--radius); overflow: hidden; }
.seg button {
  font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
  background: transparent; color: var(--muted); border: 0; padding: 3px 11px;
}
.seg button + button { border-left: 1px solid var(--line-firm); }
.seg button.on { background: var(--ink); color: var(--panel); }

.empty { color: var(--muted); padding: 14px; text-align: center; }
footer { padding: 0 20px 30px; color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>

<div id="stale" role="status"></div>

<header class="board" id="board">
  <div>
    <span class="kicker">Pick</span>
    <span class="count"><span class="big cond" id="pick-no">–</span><span class="of" id="pick-of"></span></span>
  </div>
  <div id="turn" class="state">connecting</div>
  <div class="until" id="until"></div>
  <div class="spacer"></div>
  <button class="tog" id="theme" type="button">Theme</button>
</header>

<div class="rail" id="rail"></div>

<main>
  <div class="col">
    <section class="panel">
      <div class="phead">
        <span class="ptitle">Best available</span>
        <span class="pnote" id="avail-note"></span>
        <span class="spacer"></span>
        <div class="seg" id="filter" role="group" aria-label="Filter the board">
          <button type="button" class="on" data-mode="all">All</button>
          <button type="button" data-mode="leaving">Leaving</button>
        </div>
      </div>
      <div id="at-risk" hidden></div>
      <div id="best-available"></div>
    </section>
  </div>

  <div class="col">
    <section class="panel">
      <div class="phead"><span class="ptitle">My team</span><span class="pnote" id="roster-note"></span></div>
      <div id="roster"></div>
    </section>

    <section class="panel">
      <div class="phead"><span class="ptitle">Tiers left</span><span class="pnote">players remaining</span></div>
      <div class="pbody" id="tiers"></div>
    </section>

    <section class="panel">
      <div class="phead"><span class="ptitle">Last picks</span><span class="pnote" id="run-note"></span></div>
      <div id="recent"></div>
    </section>
  </div>
</main>

<footer id="foot"></footer>

<script>
"use strict";
const REFRESH_MS = 4000, STALE_AFTER_S = 120;
const $ = (id) => document.getElementById(id);
let lastStamp = null, lastChange = Date.now();

const esc = (v) => String(v == null ? "" : v).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dash = (v) => (v == null || v === "" ? "–" : esc(v));

/* Theme: the CSS supports system, explicit light and explicit dark. */
const root = document.documentElement;
try { const t = localStorage.getItem("theme"); if (t) root.setAttribute("data-theme", t); } catch (e) { /* private mode */ }
$("theme").addEventListener("click", () => {
  const now = root.getAttribute("data-theme");
  const next = now === "dark" ? "light" : now === "light" ? null : "dark";
  if (next) root.setAttribute("data-theme", next); else root.removeAttribute("data-theme");
  try { next ? localStorage.setItem("theme", next) : localStorage.removeItem("theme"); } catch (e) { /* ignore */ }
});

function posChip(pos, posRank) {
  const key = ["QB", "RB", "WR", "TE"].includes(pos) ? pos : "";
  return `<span class="pos pos-${esc(key)}">${dash(posRank || pos)}</span>`;
}

function tags(p) {
  let out = "";
  if (p.risk_flag) out += `<span class="tag bad">${esc(p.risk_flag)}</span>`;
  if (p.sleeper_injury_status) out += `<span class="tag bad">${esc(p.sleeper_injury_status)}</span>`;
  for (const f of p.flags || []) {
    const cls = f === "value" || f === "riser" ? "good" : (f === "risk" || f === "faller") ? "bad" : "";
    out += `<span class="tag ${cls}">${esc(f.replace("_", " "))}</span>`;
  }
  if (p.handcuff_for_name) out += `<span class="tag">handcuff · ${esc(p.handcuff_for_name)}</span>`;
  const note = [p.scouting, p.note].filter(Boolean).join(" · ");
  return out + (note ? `<div class="scout">${esc(note)}</div>` : "");
}

function playerTable(rows, horizon) {
  if (!rows || !rows.length) return `<div class="empty">Nobody left here.</div>`;
  const body = rows.map((p) => {
    const delta = p.value_vs_market;
    const edge = delta ? `<span class="tag ${delta > 0 ? "good" : ""}">${delta > 0 ? "+" : ""}${esc(delta)} vs market</span>` : "";
    const fate = p.leaving === undefined ? ""
      : p.leaving ? `<span class="gone">Leaving</span>`
                  : `<span class="stays">should last</span>`;
    return `<tr class="${p.leaving ? "leaving" : ""}">
      <td class="n"><span class="rk">${dash(p.rank)}</span></td>
      <td>${posChip(p.pos, p.pos_rank)}</td>
      <td><span class="nm">${esc(p.name)}</span>
          <span class="meta"> ${dash(p.team)} · bye ${dash(p.bye)} · T${dash(p.tier)}</span>
          ${tags(p)}${edge}</td>
      <td class="n"><span class="adp">${dash(p.adp)}</span></td>
      <td>${fate}</td>
    </tr>`;
  }).join("");
  const head = horizon ? `by ${horizon}` : "";
  return `<table><thead><tr>
      <th class="n">Rk</th><th>Pos</th><th>Player</th><th class="n">ADP</th><th>${esc(head)}</th>
    </tr></thead><tbody>${body}</tbody></table>`;
}

let mode = "all";
let latest = null;
$("filter").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-mode]");
  if (!btn) return;
  mode = btn.dataset.mode;
  for (const b of $("filter").children) b.classList.toggle("on", b === btn);
  if (latest) drawBoard(latest);
});

function drawBoard(s) {
  const all = s.best_available || [];
  const rows = mode === "leaving" ? all.filter((p) => p.leaving) : all;
  const leaving = s.leaving_count;
  $("avail-note").textContent = s.survive_until_pick
    ? `${leaving} of ${all.length} gone by pick ${s.survive_until_pick} · ${s.available_count} left overall`
    : `${s.available_count} left on the board`;
  $("filter").hidden = !s.survive_until_pick;
  $("best-available").innerHTML = rows.length
    ? playerTable(rows, s.survive_until_pick)
    : `<div class="empty">Nobody in the top ${all.length} is expected to go before your pick.</div>`;
}

function renderBoard(s) {
  const board = $("board"), turn = $("turn");
  board.classList.toggle("mine", !!s.is_my_turn);
  turn.className = "state";

  if (s.current_pick == null) {
    $("pick-no").textContent = s.total_picks;
    $("pick-of").textContent = `of ${s.total_picks}`;
    turn.textContent = "Draft complete"; turn.classList.add("done");
    $("until").textContent = "Every pick is in.";
    return;
  }
  $("pick-no").textContent = s.current_pick;
  $("pick-of").textContent = `of ${s.total_picks} · Round ${s.current_round}`;

  if (s.is_my_turn) { turn.textContent = "You're on the clock"; turn.classList.add("mine"); }
  else if (s.on_the_clock_slot != null) { turn.textContent = `Slot ${s.on_the_clock_slot} picking`; }
  else { turn.textContent = "Waiting"; }

  if (s.my_slot == null) {
    $("until").innerHTML = `Slot not set — pass <b>--slot</b> for pick timing.`;
  } else if (s.survive_until_pick != null) {
    $("until").innerHTML = `<b>${s.picks_before_horizon}</b> picks by others, then you're up at <b>${s.survive_until_pick}</b>`;
  } else if (s.my_next_pick != null) {
    $("until").innerHTML = `next up at <b>${s.my_next_pick}</b>`;
  } else { $("until").textContent = "No picks left."; }
}

/* Your 13 pick numbers. Under third-round reversal the early ones cluster —
   slot 12 picks 12, 13 and 25 — and the rail makes that shape visible. */
function renderRail(s) {
  const rail = $("rail");
  if (s.my_slot == null || !(s.my_picks || []).length) { rail.hidden = true; return; }
  rail.hidden = false;
  const cells = s.my_picks.map((n) => {
    const spent = s.current_pick == null || n < s.current_pick;
    const next = n === s.my_next_pick;
    return `<span class="cell${spent ? " spent" : ""}${next ? " next" : ""}">${n}</span>`;
  }).join("");
  rail.innerHTML = `<span class="lab">Slot ${s.my_slot} picks</span>${cells}`;
}

function renderRoster(s) {
  if (s.my_slot == null) { $("roster").innerHTML = `<div class="empty">No slot set.</div>`; return; }
  const r = s.my_roster || [], need = s.roster || {}, counts = need.counts || {};
  $("roster-note").textContent = `${r.length} picked`;

  const rows = r.length
    ? `<table><tbody>${r.map((p) => `<tr>
        <td class="n"><span class="rk">${dash(p.pick_no)}</span></td>
        <td>${posChip(p.pos, p.pos)}</td>
        <td><span class="nm">${esc(p.name)}</span>
            <span class="meta"> ${dash(p.team)} · bye ${dash(p.bye)}</span></td>
      </tr>`).join("")}</tbody></table>`
    : `<div class="empty">Nothing drafted yet.</div>`;

  const filled = [];
  for (const [pos, n] of Object.entries(need.starters_filled || {})) {
    for (let i = 0; i < n; i++) filled.push(`<span class="slot filled">${esc(pos)}</span>`);
  }
  for (let i = 0; i < (need.flex_filled || 0); i++) filled.push(`<span class="slot filled">FLEX</span>`);
  const open = (need.open_starters || []).map((p) => `<span class="slot">${esc(p)}</span>`);
  if (need.flex_open) open.push(`<span class="slot">FLEX</span>`);

  const heavy = Object.entries(s.bye_counts || {}).filter(([, n]) => n >= 3)
    .map(([w, n]) => `week ${w} (${n})`);

  $("roster").innerHTML = rows + `<div class="pbody">
      <dl>
        <div class="kv"><dt>Roster</dt><dd>${esc(Object.entries(counts).map(([k, v]) => `${k} ${v}`).join(" · ") || "empty")}</dd></div>
      </dl>
      <div class="slots">${filled.join("")}${open.join("")}</div>
      ${open.length ? "" : `<div class="meta" style="margin-top:8px">All starters filled.</div>`}
      ${heavy.length ? `<div class="meta" style="margin-top:8px;color:var(--danger)">Bye stack: ${esc(heavy.join(", "))}</div>` : ""}
    </div>`;
}

function renderTiers(s) {
  const t = s.tier_status || {};
  const order = ["RB", "WR", "TE", "QB"].filter((p) => t[p]);
  if (!order.length) { $("tiers").innerHTML = `<div class="meta">Board is empty.</div>`; return; }
  const max = Math.max(...order.flatMap((p) => Object.values(t[p])), 1);
  $("tiers").innerHTML = order.map((pos) => {
    const tiers = Object.keys(t[pos]).sort((a, b) => a - b);
    const rows = tiers.map((k) => {
      const n = t[pos][k];
      // Two or fewer left in a tier is the tier-break trigger, so it reads red.
      return `<div class="tier-row${n <= 2 ? " thin" : ""}">
          <span class="tier-lab">T${esc(k)}</span>
          <span class="tier-bar"><span class="tier-fill" style="width:${Math.max(4, (n / max) * 100)}%;background:var(--${pos.toLowerCase()})"></span></span>
          <span class="tier-num">${n}</span>
        </div>`;
    }).join("");
    return `<div class="tier-pos"><div class="tier-name" style="color:var(--${pos.toLowerCase()})">${pos}</div>${rows}</div>`;
  }).join("");
}

function renderRecent(s) {
  const r = s.recent_picks || [];
  $("run-note").textContent = Object.entries(s.position_run || {})
    .sort((a, b) => b[1] - a[1]).map(([p, n]) => `${p} ${n}`).join(" · ");
  if (!r.length) { $("recent").innerHTML = `<div class="empty">No picks yet.</div>`; return; }
  $("recent").innerHTML = `<table><tbody>${r.slice().reverse().map((p) => `<tr>
      <td class="n"><span class="rk">${dash(p.pick_no)}</span></td>
      <td>${posChip(p.pos, p.pos)}</td>
      <td><span class="nm">${esc(p.name)}</span>
          <span class="meta"> ${p.draft_slot === s.my_slot ? "you" : "slot " + dash(p.draft_slot)}${p.rank ? " · #" + p.rank : ""}</span></td>
    </tr>`).join("")}</tbody></table>`;
}

function render(s) {
  latest = s;
  renderBoard(s);
  renderRail(s);
  drawBoard(s);
  renderRoster(s);
  renderTiers(s);
  renderRecent(s);
  $("foot").textContent =
    `${s.league_name || "Draft"} · ${s.picks_made} of ${s.total_picks} picks made · updated ${s.generated_at}`;
}

function stale(msg) {
  const el = $("stale");
  if (msg) { el.textContent = msg; el.classList.add("on"); } else { el.classList.remove("on"); }
}

async function tick() {
  try {
    const res = await fetch("/state.json", { cache: "no-store" });
    if (res.status === 404) { stale("Waiting for the first poll…"); return; }
    if (!res.ok) { stale(`Server returned ${res.status}.`); return; }
    const s = await res.json();
    if (s.generated_at !== lastStamp) { lastStamp = s.generated_at; lastChange = Date.now(); }
    render(s);
    const age = Math.round((Date.now() - lastChange) / 1000);
    stale(age > STALE_AFTER_S ? `No new poll for ${age}s — is sleeper-live still running?` : null);
  } catch (err) {
    stale(`Cannot reach the server (${err.message}) — is sleeper-live still running?`);
  }
}

tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
