[project]
name = "sleeper-draft-tools"
version = "0.1.0"
description = "Read-only Sleeper helpers for a personal fantasy football draft assistant"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
sleeper-discover = "sleeper_draft.discover:cli"
sleeper-batches = "sleeper_draft.batches:cli"
sleeper-past-draft = "sleeper_draft.past_draft:cli"
sleeper-board = "sleeper_draft.board:cli"
sleeper-live = "sleeper_draft.live:cli"
sleeper-keepers = "sleeper_draft.keepers:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleeper_draft"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src/sleeper_draft"]
# No python_version here: modern mypy refuses anything below 3.10, and ruff's
# target-version = "py39" plus the UP rules already hold the 3.9 floor.
# Default strictness on purpose. --strict reports 80 findings on this dict-heavy
# code, nearly all of them "annotate this dict literal"; the default catches the
# thing worth catching, which is unvalidated None flowing into a typed call.

[tool.pytest.ini_options]
testpaths = ["tests"]
