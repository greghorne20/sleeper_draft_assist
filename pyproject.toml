[project]
name = "sleeper-draft-tools"
version = "0.1.0"
description = "Read-only Sleeper helpers for a personal fantasy football draft assistant"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
sleeper-discover = "sleeper_draft.discover:cli"
sleeper-batches = "sleeper_draft.batches:cli"
sleeper-past-draft = "sleeper_draft.past_draft:cli"
sleeper-board = "sleeper_draft.board:cli"
sleeper-live = "sleeper_draft.live:cli"
sleeper-keepers = "sleeper_draft.keepers:cli"
sleeper-warroom = "sleeper_draft.warroom.runner:cli"

[project.optional-dependencies]
# The war room. Deliberately an extra: the board, the poller and the page must
# keep working on a machine where this was never installed, which on draft day is
# the whole point -- `build_agent` raises a plain "install the extra" error rather
# than anything downstream breaking.
#
# agent-framework-core rather than agent-framework: the umbrella package pulls 180
# packages including two large SDKs we never call, where core plus the Anthropic
# provider is 21. The provider packages version separately from core and are still
# prerelease, so the beta is named explicitly to tell uv it is acceptable.
#
# Markered to 3.10+ because that is what agent-framework needs. The rest of this
# project really does run on 3.9, so that floor stays where it is.
warroom = [
    "agent-framework-core>=1.17; python_version >= '3.10'",
    "agent-framework-anthropic>=1.0.0b260827; python_version >= '3.10'",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.400",
    "types-PyYAML",
    # The war-room brief schema. Its pure half -- validation, the refresh
    # trigger, prompt building -- is tested offline, so pydantic is a dev
    # dependency even though agent-framework itself is an optional extra.
    "pydantic>=2",
    "pyright>=1.1.411",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sleeper_draft"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src/sleeper_draft"]
pythonVersion = "3.9"
# Standard mode on purpose. Strict reports the same wall of "annotate this dict
# literal" on this dict-heavy code; standard catches the thing worth catching,
# which is unvalidated None flowing into a typed call.
typeCheckingMode = "standard"
# The war room's provider is an optional extra, so a machine without it must
# still type-check rather than reporting every agent_framework import as missing.
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
